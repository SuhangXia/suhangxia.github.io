<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Tactile UMI · One-trajectory audit replay</title>
  <style>
    html, body, #viewer { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #171917; }
    #status { position: absolute; z-index: 2; inset: 0; display: grid; place-content: center; gap: .8rem; padding: clamp(1rem, 4vw, 3rem); background: #171917; color: #f1efe8; font: 14px/1.6 system-ui, sans-serif; text-align: center; }
    #status[hidden] { display: none; }
    #status p { max-width: 42rem; margin: 0 auto; }
    #status h1 { font-size: 1.4rem; margin: 0; }
    #status a { color: inherit; text-underline-offset: .25em; }
    #status a:focus-visible { outline: 2px solid #dba78d; outline-offset: 3px; }
    #status nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 1rem; }
    #status details { max-width: 42rem; overflow-wrap: anywhere; }
    #status pre { white-space: pre-wrap; text-align: left; font-size: .75rem; }
    #status[data-stage="runtime"] { inset: 0 0 auto; padding: .5rem; pointer-events: none; font-size: .8rem; }
  </style>
</head>
<body>
  <div id="status" role="status" aria-live="polite">Checking browser graphics…</div>
  <div id="viewer"></div>
  <script type="module" src="./replay.mjs"></script>
</body>
</html>
