<text x="48" y="1007" class="body" style="font-size:20px">独立数据流与主机时间戳</text>
</g>
<g data-node="align"><rect x="28" y="1072" width="384" height="100" rx="3" fill="#fff" stroke="#d1d8ce"/>
<text x="48" y="1103" class="node-title" >时间对齐与位姿派生</text>
<text x="48" y="1129" class="body" style="font-size:20px">应用实测延迟偏移</text>
<text x="48" y="1152" class="body" style="font-size:20px">相机相对位姿 / 动作记录</text>
</g>
<g data-node="audit"><rect x="28" y="1204" width="384" height="100" rx="3" fill="#fff" stroke="#d1d8ce"/>
