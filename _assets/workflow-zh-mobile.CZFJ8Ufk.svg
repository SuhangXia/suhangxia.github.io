<text x="48" y="2191" class="body" style="font-size:20px">TCP 通信桥 · Robotiq 夹爪</text>
<text x="48" y="2214" class="body" style="font-size:20px">Polymetis 阻抗控制</text>
</g>
</g>
<text x="32" y="660" class="mobile-link" >标定配置 → 采集与时间对齐</text>
<text x="32" y="1472" class="mobile-link" >清洗后 Zarr → 扩散策略训练</text>
<text x="28" y="2258" class="footer" >原始采集数据保持不变。</text>
