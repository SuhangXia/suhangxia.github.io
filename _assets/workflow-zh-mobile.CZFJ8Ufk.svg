<text x="48" y="875" class="body" style="font-size:20px">腕部 RGB · 左右触觉</text>
<text x="48" y="898" class="body" style="font-size:20px">Quest 位姿 · 夹爪状态</text>
</g>
<g data-node="raw"><rect x="28" y="950" width="384" height="90" rx="3" fill="#f1f3ee" stroke="#d1d8ce"/>
