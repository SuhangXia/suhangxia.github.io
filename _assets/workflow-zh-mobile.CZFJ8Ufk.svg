<text x="48" y="2059" class="body" style="font-size:20px">RGB + 状态 + 可学习触觉 adapter</text>
<text x="48" y="2082" class="body" style="font-size:20px">八步相机相对 7D 动作</text>
</g>
<g data-node="robot"><rect x="28" y="2134" width="384" height="90" rx="3" fill="#fff" stroke="#d1d8ce"/>
