<text x="28" y="737" class="number" >02</text>
<text x="76" y="737" class="stage-title" >数据采集与审查</text>
<text x="28" y="769" class="subtitle" >原始记录 → 训练数据</text>
<path d="M28 788H412" stroke="#bfc8bb"/>
