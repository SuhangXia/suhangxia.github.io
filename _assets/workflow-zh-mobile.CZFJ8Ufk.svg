<text x="48" y="451" class="body" style="font-size:20px">夹爪宽度 LUT · Quest/RGB 偏移</text>
<text x="48" y="474" class="body" style="font-size:20px">触觉相机延迟标定</text>
</g>
<g data-node="calibration"><rect x="28" y="526" width="384" height="90" rx="3" fill="#f1f3ee" stroke="#d1d8ce"/>
