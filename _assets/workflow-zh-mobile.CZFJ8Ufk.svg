<g data-stage="1">
<text x="28" y="49" class="number" >01</text>
<text x="76" y="49" class="stage-title" >空间与时间标定</text>
<text x="28" y="81" class="subtitle" >安装几何与传感器时钟</text>
<path d="M28 100H412" stroke="#bfc8bb"/>
<g data-node="mounts"><rect x="28" y="130" width="384" height="100" rx="3" fill="#fff" stroke="#d1d8ce"/>
<text x="48" y="161" class="node-title" >安装与相机标定</text>
<text x="48" y="187" class="body" style="font-size:20px">固定安装 · 独立相机内参</text>
<text x="48" y="210" class="body" style="font-size:20px">FR3 腕部相机手眼标定</text>
</g>
<g data-node="quest"><rect x="28" y="262" width="384" height="100" rx="3" fill="#fff" stroke="#d1d8ce"/>
<text x="48" y="293" class="node-title" >Quest–相机手眼标定</text>
<text x="48" y="319" class="body" style="font-size:20px">TCP 几何 · 变换方向</text>
<text x="48" y="342" class="body" style="font-size:20px">多姿态标定与一致性检查</text>
</g>
<g data-node="timing"><rect x="28" y="394" width="384" height="100" rx="3" fill="#fff" stroke="#d1d8ce"/>
