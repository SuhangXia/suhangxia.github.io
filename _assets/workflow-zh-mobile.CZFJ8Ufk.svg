<text x="48" y="1261" class="body" style="font-size:20px">CLI：完整性 · 时间 · 跳变检查</text>
<text x="48" y="1284" class="body" style="font-size:20px">网页：时间线复核 · 人工筛选</text>
</g>
<g data-node="zarr"><rect x="28" y="1336" width="384" height="90" rx="3" fill="#f1f3ee" stroke="#d1d8ce"/>
<path d="M29 1348V1414" stroke="#476b5a" stroke-width="3"/>
<text x="48" y="1367" class="node-title" >清洗后 Zarr</text>
<text x="48" y="1393" class="body" style="font-size:20px">7D 动作 · 六帧触觉历史记录</text>
</g>
</g>
<g data-stage="3">
<text x="28" y="1535" class="number" >03</text>
<text x="76" y="1535" class="stage-title" >模型学习与执行</text>
<text x="28" y="1567" class="subtitle" >两阶段 UniForce → 机器人策略</text>
<path d="M28 1586H412" stroke="#bfc8bb"/>
<g data-node="pretrain"><rect x="28" y="1616" width="384" height="100" rx="3" fill="#fff" stroke="#d1d8ce"/>
<text x="48" y="1647" class="node-title" >仿真预训练</text>
<text x="48" y="1673" class="body" style="font-size:20px">Taichi 仅压入阶段仿真数据</text>
<text x="48" y="1696" class="body" style="font-size:20px">UniForce 触觉表征</text>
</g>
<g data-node="adapt"><rect x="28" y="1748" width="384" height="100" rx="3" fill="#fff" stroke="#d1d8ce"/>
<text x="48" y="1779" class="node-title" >真实传感器适配</text>
<text x="48" y="1805" class="body" style="font-size:20px">配对真实触觉按压记录</text>
<text x="48" y="1828" class="body" style="font-size:20px">六帧因果时间窗口</text>
</g>
<g data-node="frozen"><rect x="28" y="1880" width="384" height="90" rx="3" fill="#e8eee6" stroke="#d1d8ce"/>
<path d="M29 1892V1958" stroke="#476b5a" stroke-width="3"/>
<text x="48" y="1911" class="node-title" >冻结 UniForce</text>
<text x="48" y="1937" class="body" style="font-size:20px">策略训练期间不更新编码器</text>
</g>
<g data-node="policy"><rect x="28" y="2002" width="384" height="100" rx="3" fill="#fff" stroke="#d1d8ce"/>
