<g data-stage="1">
<text x="36" y="59" class="number" >01</text>
<text x="84" y="59" class="stage-title" >空间与时间标定</text>
<text x="36" y="91" class="subtitle" >安装几何与传感器时钟</text>
<path d="M36 110H460" stroke="#bfc8bb"/>
<g data-node="mounts"><rect x="36" y="126" width="424" height="100" rx="3" fill="#fff" stroke="#d1d8ce"/>
<text x="56" y="157" class="node-title" >安装与相机标定</text>
<text x="56" y="183" class="body" style="font-size:17px">固定安装 · 独立相机内参</text>
<text x="56" y="206" class="body" style="font-size:17px">FR3 腕部相机手眼标定</text>
</g>
<g data-node="quest"><rect x="36" y="258" width="424" height="100" rx="3" fill="#fff" stroke="#d1d8ce"/>
<text x="56" y="289" class="node-title" >Quest–相机手眼标定</text>
<text x="56" y="315" class="body" style="font-size:17px">TCP 几何 · 变换方向</text>
<text x="56" y="338" class="body" style="font-size:17px">多姿态标定与一致性检查</text>
</g>
<g data-node="timing"><rect x="36" y="390" width="424" height="100" rx="3" fill="#fff" stroke="#d1d8ce"/>
<text x="56" y="421" class="node-title" >夹爪与跨流时间标定</text>
<text x="56" y="447" class="body" style="font-size:17px">ArUco 宽度查找表 · Quest/RGB 偏移</text>
<text x="56" y="470" class="body" style="font-size:17px">触觉相机延迟标定</text>
</g>
<g data-node="calibration"><rect x="36" y="522" width="424" height="90" rx="3" fill="#f1f3ee" stroke="#d1d8ce"/>
<path d="M37 534V600" stroke="#476b5a" stroke-width="3"/>
