<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">ClothUMI UniForce-conditioned Diffusion Policy architecture</title>
  <desc id="desc">RGB and robot state pass through a DINO encoder while six-frame left and right tactile histories pass through a frozen UniForce encoder. The features are fused to condition a diffusion policy action decoder.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#686a66"/>
    </marker>
    <style>
      .label { font: 700 22px Arial, sans-serif; fill: #171916; }
      .small { font: 500 17px Arial, sans-serif; fill: #686a66; }
      .tag { font: 700 15px Arial, sans-serif; letter-spacing: 1.4px; fill: #a34d2f; }
      .box { stroke-width: 2; rx: 10; }
      .flow { fill: none; stroke: #686a66; stroke-width: 3; marker-end: url(#arrow); }
      .touch-flow { fill: none; stroke: #c56d35; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="620" fill="#f4f2eb"/>
  <text class="tag" x="60" y="55">POLICY INPUTS</text>
  <text class="tag" x="445" y="55">FROZEN / ADAPTED ENCODERS</text>
  <text class="tag" x="1015" y="55">CONDITIONED ACTION GENERATION</text>

  <rect class="box" x="60" y="105" width="255" height="92" fill="#e7eef2" stroke="#22577a"/>
  <text class="label" x="187" y="143" text-anchor="middle">RGB history</text>
  <text class="small" x="187" y="173" text-anchor="middle">2 policy frames</text>

  <rect class="box" x="60" y="220" width="255" height="92" fill="#e7eef2" stroke="#22577a"/>
  <text class="label" x="187" y="258" text-anchor="middle">Camera state</text>
  <text class="small" x="187" y="288" text-anchor="middle">pose + gripper gap</text>

  <rect class="box" x="60" y="375" width="255" height="78" fill="#faece1" stroke="#c56d35"/>
  <text class="label" x="187" y="408" text-anchor="middle">Left tactile</text>
  <text class="small" x="187" y="435" text-anchor="middle">reference + 6 frames</text>

  <rect class="box" x="60" y="475" width="255" height="78" fill="#faece1" stroke="#c56d35"/>
  <text class="label" x="187" y="508" text-anchor="middle">Right tactile</text>
  <text class="small" x="187" y="535" text-anchor="middle">reference + 6 frames</text>

  <rect class="box" x="420" y="145" width="245" height="135" fill="#e7eef2" stroke="#22577a"/>
  <text class="label" x="542" y="190" text-anchor="middle">DINO ViT-B</text>
  <text class="small" x="542" y="224" text-anchor="middle">frozen base</text>
  <text class="small" x="542" y="253" text-anchor="middle">LoRA · last 4 blocks</text>

  <rect class="box" x="420" y="390" width="245" height="140" fill="#faece1" stroke="#c56d35"/>
  <text class="label" x="542" y="434" text-anchor="middle">Frozen UniForce</text>
  <text class="small" x="542" y="468" text-anchor="middle">temporal encoder</text>
  <text class="small" x="542" y="497" text-anchor="middle">300 × 6 latent</text>

  <rect class="box" x="735" y="410" width="220" height="100" fill="#faece1" stroke="#c56d35"/>
  <text class="label" x="845" y="449" text-anchor="middle">Tactile adapter</text>
  <text class="small" x="845" y="480" text-anchor="middle">8 contact tokens</text>

  <rect class="box" x="1010" y="205" width="205" height="135" fill="#e3f1ee" stroke="#38a3a5"/>
  <text class="label" x="1112" y="250" text-anchor="middle">Global condition</text>
  <text class="label" x="1112" y="280" text-anchor="middle">fusion</text>
  <text class="small" x="1112" y="311" text-anchor="middle">vision + state + touch</text>

  <rect class="box" x="1275" y="205" width="255" height="135" fill="#e8f3e9" stroke="#4e9b6f"/>
  <text class="label" x="1402" y="247" text-anchor="middle">Conditional U-Net</text>
  <text class="small" x="1402" y="280" text-anchor="middle">50 train steps</text>
  <text class="small" x="1402" y="309" text-anchor="middle">16 DDIM steps</text>

  <rect class="box" x="1275" y="415" width="255" height="105" fill="#e8f3e9" stroke="#4e9b6f"/>
  <text class="label" x="1402" y="454" text-anchor="middle">8 × 7 actions</text>
  <text class="small" x="1402" y="485" text-anchor="middle">camera-relative SE(3) + gap</text>

  <path class="flow" d="M315 151 H385 Q405 151 420 180"/>
  <path class="flow" d="M315 266 H385 Q405 266 420 244"/>
  <path class="touch-flow" d="M315 414 H420"/>
  <path class="touch-flow" d="M315 514 H420"/>
  <path class="touch-flow" d="M665 460 H735"/>
  <path class="flow" d="M665 213 H970 Q990 213 1010 245"/>
  <path class="touch-flow" d="M955 460 H980 Q1000 460 1010 320"/>
  <path class="flow" d="M1215 272 H1275"/>
  <path class="flow" d="M1402 340 V415"/>
  <path class="flow" d="M1275 468 H1170 Q1112 468 1112 340"/>

  <rect x="720" y="535" width="265" height="52" rx="8" fill="#ffffff" stroke="#b5b4ae"/>
  <text class="small" x="852" y="567" text-anchor="middle">Dashed branch removed for vision-only DP</text>
</svg>
