<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="824" viewBox="0 0 1440 824" role="img" aria-labelledby="title description">
<title id="title">Tactile UMI: calibration, dataset curation and policy deployment</title>
<desc id="description">Three stages connect calibrated acquisition, raw H5, alignment and audit, clean Zarr, simulation-pretrained and real-adapted UniForce, frozen tactile encoding, Diffusion Policy and Franka FR3 execution.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#476b5a"/></marker></defs>
<style>text{font-family:Inter,Arial,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#26332d}.stage-title{font-size:26px;font-weight:600}.number{font-size:20px;font-weight:600;fill:#a5543c}.subtitle{font-size:18px;fill:#6b7367}.node-title{font-size:21px;font-weight:600}.body{fill:#677161}.connector-label{font-size:14px;fill:#737c6d}.footer{font-size:16px;fill:#6b7367}.mobile-link{font-size:17px;fill:#476b5a}</style>
<rect width="100%" height="100%" fill="#fff"/>
<path d="M248 231V251" fill="none" stroke="#476b5a" stroke-width="1.6"  marker-end="url(#arrow)"/>
<path d="M248 363V383" fill="none" stroke="#476b5a" stroke-width="1.6"  marker-end="url(#arrow)"/>
<path d="M248 495V515" fill="none" stroke="#476b5a" stroke-width="1.6"  marker-end="url(#arrow)"/>
<path d="M720 231V251" fill="none" stroke="#476b5a" stroke-width="1.6"  marker-end="url(#arrow)"/>
<path d="M720 353V373" fill="none" stroke="#476b5a" stroke-width="1.6"  marker-end="url(#arrow)"/>
<path d="M720 485V505" fill="none" stroke="#476b5a" stroke-width="1.6"  marker-end="url(#arrow)"/>
<path d="M720 617V637" fill="none" stroke="#476b5a" stroke-width="1.6"  marker-end="url(#arrow)"/>
<path d="M1192 231V251" fill="none" stroke="#476b5a" stroke-width="1.6"  marker-end="url(#arrow)"/>
<path d="M1192 363V383" fill="none" stroke="#476b5a" stroke-width="1.6"  marker-end="url(#arrow)"/>
<path d="M1192 485V505" fill="none" stroke="#476b5a" stroke-width="1.6"  marker-end="url(#arrow)"/>
<path d="M1192 617V637" fill="none" stroke="#476b5a" stroke-width="1.6"  marker-end="url(#arrow)"/>
<path d="M460 567H484V176H503" fill="none" stroke="#8d9688" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<path d="M932 689H956V562H975" fill="none" stroke="#8d9688" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<g data-stage="1">
<text x="36" y="59" class="number" >01</text>
<text x="84" y="59" class="stage-title" >Calibrate</text>
<text x="36" y="91" class="subtitle" >Geometry &amp; sensor clocks</text>
<path d="M36 110H460" stroke="#bfc8bb"/>
<g data-node="mounts"><rect x="36" y="126" width="424" height="100" rx="3" fill="#fff" stroke="#d1d8ce"/>
<text x="56" y="157" class="node-title" >Mounts &amp; camera calibration</text>
<text x="56" y="183" class="body" style="font-size:17px">Rigid mounts · independent intrinsics</text>
<text x="56" y="206" class="body" style="font-size:17px">FR3 wrist-camera hand–eye calibration</text>
</g>
<g data-node="quest"><rect x="36" y="258" width="424" height="100" rx="3" fill="#fff" stroke="#d1d8ce"/>
<text x="56" y="289" class="node-title" >Quest–camera hand–eye</text>
<text x="56" y="315" class="body" style="font-size:17px">TCP geometry · transform direction</text>
<text x="56" y="338" class="body" style="font-size:17px">Multi-pose calibration &amp; consistency</text>
</g>
<g data-node="timing"><rect x="36" y="390" width="424" height="100" rx="3" fill="#fff" stroke="#d1d8ce"/>
<text x="56" y="421" class="node-title" >Gripper &amp; stream timing</text>
<text x="56" y="447" class="body" style="font-size:17px">ArUco width LUT · Quest/RGB offset</text>
<text x="56" y="470" class="body" style="font-size:17px">Tactile-camera latency calibration</text>
</g>
<g data-node="calibration"><rect x="36" y="522" width="424" height="90" rx="3" fill="#f1f3ee" stroke="#d1d8ce"/>
<path d="M37 534V600" stroke="#476b5a" stroke-width="3"/>
<text x="56" y="553" class="node-title" >Calibration configuration</text>
<text x="56" y="579" class="body" style="font-size:17px">Views · transforms · widths · offsets</text>
</g>
</g>
<g data-stage="2">
<text x="508" y="59" class="number" >02</text>
<text x="556" y="59" class="stage-title" >Collect &amp; curate</text>
<text x="508" y="91" class="subtitle" >Native records → training dataset</text>
<path d="M508 110H932" stroke="#bfc8bb"/>
<g data-node="record"><rect x="508" y="126" width="424" height="100" rx="3" fill="#fff" stroke="#d1d8ce"/>
<text x="528" y="157" class="node-title" >Multimodal recording</text>
<text x="528" y="183" class="body" style="font-size:17px">Wrist RGB · left/right tactile</text>
<text x="528" y="206" class="body" style="font-size:17px">Quest motion · gripper state</text>
</g>
<g data-node="raw"><rect x="508" y="258" width="424" height="90" rx="3" fill="#f1f3ee" stroke="#d1d8ce"/>
<path d="M509 270V336" stroke="#476b5a" stroke-width="3"/>
<text x="528" y="289" class="node-title" >Raw H5</text>
<text x="528" y="315" class="body" style="font-size:17px">Separate streams &amp; host timestamps</text>
</g>
<g data-node="align"><rect x="508" y="380" width="424" height="100" rx="3" fill="#fff" stroke="#d1d8ce"/>
<text x="528" y="411" class="node-title" >Align &amp; derive poses</text>
<text x="528" y="437" class="body" style="font-size:17px">Apply measured latency offsets</text>
<text x="528" y="460" class="body" style="font-size:17px">Camera-relative pose / action records</text>
</g>
<g data-node="audit"><rect x="508" y="512" width="424" height="100" rx="3" fill="#fff" stroke="#d1d8ce"/>
<text x="528" y="543" class="node-title" >Audit &amp; select</text>
<text x="528" y="569" class="body" style="font-size:17px">CLI: integrity · timing · jumps</text>
<text x="528" y="592" class="body" style="font-size:17px">Web: timeline review · manual decisions</text>
</g>
<g data-node="zarr"><rect x="508" y="644" width="424" height="90" rx="3" fill="#f1f3ee" stroke="#d1d8ce"/>
<path d="M509 656V722" stroke="#476b5a" stroke-width="3"/>
<text x="528" y="675" class="node-title" >Clean Zarr</text>
<text x="528" y="701" class="body" style="font-size:17px">7D actions · six-record tactile histories</text>
</g>
</g>
<g data-stage="3">
<text x="980" y="59" class="number" >03</text>
<text x="1028" y="59" class="stage-title" >Learn &amp; execute</text>
<text x="980" y="91" class="subtitle" >Two-stage UniForce → robot policy</text>
<path d="M980 110H1404" stroke="#bfc8bb"/>
<g data-node="pretrain"><rect x="980" y="126" width="424" height="100" rx="3" fill="#fff" stroke="#d1d8ce"/>
<text x="1000" y="157" class="node-title" >Simulation pretraining</text>
<text x="1000" y="183" class="body" style="font-size:17px">Taichi loading-only indentation data</text>
<text x="1000" y="206" class="body" style="font-size:17px">UniForce tactile representation</text>
</g>
<g data-node="adapt"><rect x="980" y="258" width="424" height="100" rx="3" fill="#fff" stroke="#d1d8ce"/>
<text x="1000" y="289" class="node-title" >Real-sensor adaptation</text>
<text x="1000" y="315" class="body" style="font-size:17px">Paired real tactile press recordings</text>
<text x="1000" y="338" class="body" style="font-size:17px">Six-frame causal windows</text>
</g>
<g data-node="frozen"><rect x="980" y="390" width="424" height="90" rx="3" fill="#e8eee6" stroke="#d1d8ce"/>
<path d="M981 402V468" stroke="#476b5a" stroke-width="3"/>
<text x="1000" y="421" class="node-title" >Frozen UniForce</text>
<text x="1000" y="447" class="body" style="font-size:17px">Encoder fixed during policy training</text>
</g>
<g data-node="policy"><rect x="980" y="512" width="424" height="100" rx="3" fill="#fff" stroke="#d1d8ce"/>
<text x="1000" y="543" class="node-title" >Tactile-conditioned DP</text>
<text x="1000" y="569" class="body" style="font-size:17px">RGB + state + learned tactile adapter</text>
<text x="1000" y="592" class="body" style="font-size:17px">Eight camera-relative 7D actions</text>
</g>
<g data-node="robot"><rect x="980" y="644" width="424" height="90" rx="3" fill="#fff" stroke="#d1d8ce"/>
<text x="1000" y="675" class="node-title" >Franka FR3 execution</text>
<text x="1000" y="701" class="body" style="font-size:17px">TCP bridge · Robotiq gripper</text>
<text x="1000" y="724" class="body" style="font-size:17px">Polymetis impedance control</text>
</g>
</g>
<text x="472" y="370" class="connector-label" text-anchor="middle" transform="rotate(-90 472 370)">calibration config</text>
<text x="944" y="635" class="connector-label" text-anchor="middle" transform="rotate(-90 944 635)">policy data</text>
<path d="M36 770H1404" stroke="#d1d8ce"/>
<text x="36" y="800" class="footer" >Solid: workflow    ·    Dashed: cross-stage configuration / data</text>
<text x="1404" y="800" class="footer" text-anchor="end">Raw recordings remain unchanged.</text>
</svg>
